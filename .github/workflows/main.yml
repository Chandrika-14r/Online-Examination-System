name: Online Examination System CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp exam.html dist/exam.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test index.html
        run: |
          test -f index.html
          test -f exam.html
          grep -q "Online Examination System" index.html
          grep -q "Online Examination" exam.html
          grep -q "Submit Exam" exam.html
          echo "All tests passed successfully."


  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, test]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4